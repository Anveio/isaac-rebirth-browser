name: Live original and browser game contracts

# Live original/browser suites are too heavy for every pull request revision;
# pull requests run build.yml. The full matrix runs after each merge to main,
# every six hours (fresh OS-random cases) and on dispatch.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One live matrix at a time; a running main matrix is never cancelled.
  group: live-games-main
  cancel-in-progress: false

jobs:
  live-suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      scripts: ${{ steps.suites.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore build downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-live-games-${{ hashFiles('engine/Cargo.lock', 'engine/src/**', 'engine/build.rs', 'package-lock.json') }}
          restore-keys: ${{ runner.os }}-live-games-
      - name: Install toolchains and prepare the original runtime
        env:
          SKIP_PRODUCTION_BUILD: '1'
        run: bash cloud/install.sh
      - name: Check and build the shared production artifact
        run: |
          source cloud/env.sh
          npm run check:build
          node tools/e2e/shared-build.mjs --write
      - name: Share the checked production artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-game-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            shared/
          if-no-files-found: error
          retention-days: 14
      - name: Discover every registered live game suite
        id: suites
        run: echo "scripts=$(node tools/e2e/run.mjs --list)" >> "$GITHUB_OUTPUT"
  paired-games:
    needs: live-suites
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJSON(needs.live-suites.outputs.scripts) }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore build and browser downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ms-playwright
            engine/target
          key: ${{ runner.os }}-live-games-${{ hashFiles('engine/Cargo.lock', 'engine/src/**', 'engine/build.rs', 'package-lock.json') }}
          restore-keys: ${{ runner.os }}-live-games-
      - name: Install toolchains and prepare both games
        env:
          SKIP_PRODUCTION_BUILD: '1'
        run: |
          bash cloud/install.sh
          npx playwright install --with-deps chromium
      - name: Receive the checked production artifact
        uses: actions/download-artifact@v4
        with:
          name: live-game-build-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify and place the shared build
        run: |
          node tools/e2e/shared-build.mjs --verify
      - name: Run live original/browser scenarios
        run: |
          source cloud/env.sh
          npm run test:e2e -- --suite '${{ matrix.script }}'
      - name: Retain replay tapes and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-game-evidence-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            shared/build-identity.json
            .cache/foundation/paired-*/
            .cache/foundation/floor-e2e*.json
            .cache/foundation/floor-browser-live.json
            .cache/original-floor/**
            .cache/e2e/**
            test-results/
            !.cache/foundation/paired-*/**/game/**
            !.cache/original-floor/**/game/**
            !.cache/e2e/**/game/**
          if-no-files-found: warn
          retention-days: 14
