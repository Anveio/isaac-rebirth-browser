[package]
name = "rebirth-cleanroom"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# wasm32 std's own sinf/cosf implementation, used on every target so native
# builds compute the shipped artifact's results (engine/src/fmath.rs).
libm = "0.2"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[build-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
