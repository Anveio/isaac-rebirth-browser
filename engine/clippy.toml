# Std float functions whose precision Rust documents as unspecified. Native
# builds call the host C library while the shipped wasm32 artifact uses Rust's
# libm, and the two disagree in the last bit on some inputs. Engine code calls
# crate::fmath, which computes the wasm32 results on every build; add a libm
# wrapper there when a new function is needed (see docs/dst.md).
disallowed-methods = [
  { path = "f32::sin", reason = "native and wasm32 results differ; use crate::fmath" },
  { path = "f32::cos", reason = "native and wasm32 results differ; use crate::fmath" },
  { path = "f32::tan", reason = "native and wasm32 results differ; use crate::fmath" },
